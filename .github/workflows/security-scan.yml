name: Security scan

# Scans for committed secrets. Runs on push, PR, and weekly.
# GitHub's built-in secret-scanning is on too (noted in the repo info API),
# but gitleaks catches custom patterns and historical commits.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '7 7 * * 1'  # Mondays 07:07 UTC
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so historical commits are scanned

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    # CodeQL uploads to code scanning, which a private repo on the free plan
    # does not have: 'Code scanning is not enabled for this repository.'
    # Skip rather than fail; re-runs by itself if the repo goes public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4
