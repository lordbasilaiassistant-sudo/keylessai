name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The daily providers-catalog sync now merges itself (see sync-providers.yml).
  # That merge is performed by github-actions[bot] using GITHUB_TOKEN, and a
  # push made with GITHUB_TOKEN does NOT start a workflow run - measured on the
  # merge of PR #81, which produced no push-event runs on main at all. So the
  # `push` trigger above never fires for a synced catalog and Pages would keep
  # serving a stale providers/_catalog.json until some human pushed to main.
  #
  # Run on a schedule as well, an hour after the 06:00 UTC sync, so the site
  # picks the catalog up regardless of who merged it.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages is not available for a private repo on the free plan, so
    # Configure Pages fails with 'Get Pages site failed ... Not Found'. Skip
    # rather than fail; this starts working again by itself if the repo goes
    # public. Last successful deploy: 2026-04-28.
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage public site (exclude internal dirs)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='node_modules' \
            --exclude='dogfood' \
            --exclude='test' \
            --exclude='memory' \
            --exclude='worker' \
            --exclude='bin' \
            --exclude='*.log' \
            --exclude='.env*' \
            ./ _site/
          echo "::group::Staged files"
          find _site -maxdepth 2 -type f | sort
          echo "::endgroup::"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
